name = "ordra"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Non-secret config. Ordra has no secrets in slice 1.
[vars]
REGISTRY_URL = "https://agent-registry-mcp.concordium.com"
NETWORK = "testnet"
REGISTRY_CONTRACT = "12802,0"     # testnet CIS-8004 Agent Registry (verified 2026-11-24)
CACHE_TTL_SECONDS = "60"
FAILURE_CACHE_TTL_SECONDS = "5"   # capped at 5 in code
REGISTRY_TIMEOUT_MS = "10000"
AUDIT_RETENTION_SECONDS = "0"     # 0 = keep forever

# Audit log. Without an `id`, `wrangler dev` uses a local KV store.
# Before deploying, create a namespace (`npx wrangler kv namespace create AUDIT`)
# and add its id here, or let wrangler provision one on deploy.
[[kv_namespaces]]
binding = "AUDIT"
